<style>
  body { background-color: #F8FAFC; }
  .fade-in { opacity: 0; transform: translateY(12px); animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .like-btn.liked svg { fill: #F59E0B; stroke: #F59E0B; }
  .like-btn.liked span { color: #F59E0B; }
  .skeleton { background: linear-gradient(90deg,#E2E8F0 25%,#EDF2F7 37%,#E2E8F0 63%); background-size:400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  :focus-visible { outline: 2px solid #14B8A6; outline-offset: 2px; }

  @media (min-width: 768px) {
    #sidebarAside { transition: transform 0.28s ease; transform: translateX(100%); z-index: 60; }
    #sidebarAside.sidebar-open { transform: translateX(0); }
    #sidebarBackdrop { transition: opacity 0.28s ease; opacity: 0; pointer-events: none; z-index: 55; }
    #sidebarBackdrop.visible { opacity: 1; pointer-events: auto; }
  }

  /* iOS-style glassy buttons */
  .glass-primary {
    background: rgba(37,99,235,0.78);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 16px rgba(37,99,235,0.28), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: all 0.2s ease;
  }
  .glass-primary:hover { background: rgba(37,99,235,0.92); box-shadow: 0 6px 22px rgba(37,99,235,0.38), inset 0 1px 0 rgba(255,255,255,0.35); }
  .glass-light {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 14px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: all 0.2s ease;
  }
  .glass-light:hover { background: rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(15,23,42,0.1); }
  .glass-dark {
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    color: white;
    transition: all 0.2s ease;
  }
  .glass-dark:hover { background: rgba(15,23,42,0.72); box-shadow: 0 6px 22px rgba(0,0,0,0.32); }


  /* Animated iridescent shader-style border (like the Dribbble reference) */
  .glass-primary, .glass-light, .glass-dark {
    position: relative;
    z-index: 0;
  }
  .glass-primary::before, .glass-light::before, .glass-dark::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: conic-gradient(from 0deg, #60a5fa, #a78bfa, #f472b6, #fbbf24, #34d399, #60a5fa);
    z-index: -1;
    animation: shaderSpin 3.5s linear infinite;
    opacity: 0.9;
  }
  @keyframes shaderSpin {
    to { transform: rotate(1turn); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glass-primary::before, .glass-light::before, .glass-dark::before { animation: none; }
  }

</style>

  <script>
    // Picell — Supabase client config (inlined so it never depends on a separate file/folder upload)
    const SUPABASE_URL = 'https://hdfphesajupqphnbmjod.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NVkl8mcfd5Qxow-9t39sPA_OPQAcEQo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  </script>
  <script>
    let currentUser = null;
    let myComments = {}; // article_id -> comment_text
    let myLikes = new Set();

    function showFatalError(context, err) {
      console.error(context, err);
      let banner = document.getElementById('fatalErrorBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'fatalErrorBanner';
        banner.style.cssText = 'position:relative;z-index:9999;background:#FEF2F2;color:#B91C1C;padding:12px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;border-bottom:2px solid #FCA5A5;';
        document.body.prepend(banner);
      }
      banner.textContent = `⚠ ${context}: ${err?.message || err}`;
    }
    window.addEventListener('unhandledrejection', (e) => showFatalError('Unhandled error', e.reason));

    // ---------- SIDEBAR DRAWER ----------
    const SIDEBAR_KEY = 'bd_sidebar_collapsed';
    function applySidebarState() {
      const open = localStorage.getItem(SIDEBAR_KEY) === 'open';
      document.getElementById('sidebarAside').classList.toggle('sidebar-open', open);
      document.getElementById('sidebarBackdrop').classList.toggle('visible', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }
    function setSidebarOpen(open) {
      localStorage.setItem(SIDEBAR_KEY, open ? 'open' : 'closed');
      applySidebarState();
    }
    applySidebarState();
    document.getElementById('sidebarOpenBtn').addEventListener('click', () => setSidebarOpen(true));
    document.getElementById('sidebarCollapseBtn').addEventListener('click', () => setSidebarOpen(false));
    document.getElementById('sidebarBackdrop').addEventListener('click', () => setSidebarOpen(false));
    document.querySelectorAll('#sidebarAside [data-sidebar-nav]').forEach(link => {
      link.addEventListener('click', () => setSidebarOpen(false));
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('logoutBtnMobile').addEventListener('click', logout);
    document.getElementById('mobileAvatarBtn').addEventListener('click', () => document.getElementById('mobileProfileSheet').classList.remove('hidden'));
    document.getElementById('profileMenuMobileBtn').addEventListener('click', () => document.getElementById('mobileProfileSheet').classList.remove('hidden'));

    // ---------- AUTH GUARD ----------
    (async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError || !user) {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        currentUser = user;

        const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', currentUser.id).maybeSingle();
        const name = profile?.full_name || 'Student';
        const initial = name.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = name;
        document.getElementById('sidebarAvatar').textContent = initial;
        document.getElementById('mobileAvatarBtn').textContent = initial;
        document.getElementById('sheetAvatar').textContent = initial;
        document.getElementById('sheetName').textContent = name;

        await loadArticles();
      } catch (err) {
        showFatalError('Articles page failed to load', err);
      }
    })();

    function timeAgo(dateStr) {
      const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diff < 3600) return `${Math.max(1, Math.floor(diff / 60))}m`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
      return `${Math.floor(diff / 86400)}d`;
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function countWords(str) {
      return str.trim().split(/\s+/).filter(Boolean).length;
    }

    async function loadArticles() {
      const feed = document.getElementById('articlesFeed');
      feed.innerHTML = Array(2).fill('<div class="skeleton rounded-2xl h-64"></div>').join('');

      const { data: articles, error } = await supabaseClient
        .from('articles').select('*')
        .eq('is_published', true).eq('is_hidden', false)
        .order('created_at', { ascending: false });

      if (error) { showFatalError('Could not load articles', error); feed.innerHTML = ''; return; }

      feed.innerHTML = '';
      if (!articles || articles.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }

      const articleIds = articles.map(a => a.id);
      const [{ data: comments }, { data: likes }] = await Promise.all([
        supabaseClient.from('article_comments').select('article_id, comment_text').eq('user_id', currentUser.id).in('article_id', articleIds),
        supabaseClient.from('article_likes').select('article_id').eq('user_id', currentUser.id).in('article_id', articleIds),
      ]);
      (comments || []).forEach(c => { myComments[c.article_id] = c.comment_text; });
      myLikes = new Set((likes || []).map(l => l.article_id));

      articles.forEach(article => feed.appendChild(renderArticleCard(article)));
    }

    function renderArticleCard(article) {
      const el = document.createElement('article');
      el.className = 'fade-in bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm';
      const isLiked = myLikes.has(article.id);
      const existingComment = myComments[article.id];

      el.innerHTML = `
        <div class="p-4 flex items-center gap-3 border-b border-slate-50">
          <span class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2V8" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="9.5" r="2" stroke="white" stroke-width="2"/>
              <path d="M5 13C5 13 6.5 19 12 19C17.5 19 19 13 19 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M2 13H22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <p class="font-display font-600 text-sm text-ink">Picell</p>
            <p class="text-xs text-slate-400">${timeAgo(article.created_at)} ${article.subject ? '· ' + escapeHtml(article.subject) : ''}</p>
          </div>
        </div>

        <div class="px-4 pt-3 pb-2">
          <p class="font-display font-700 text-ink text-base leading-snug">${escapeHtml(article.copy)}</p>
        </div>
        <div class="px-4 pb-4">
          <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">${escapeHtml(article.creative)}</p>
        </div>

        <div class="px-4 pb-3 flex items-center gap-2 text-xs text-slate-400">
          <span class="like-count">${article.likes_count}</span>
          <span>likes</span>
        </div>

        <div class="border-t border-slate-100 px-4 py-2 flex items-center">
          <button class="like-btn ${isLiked ? 'liked' : ''} flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? '#F59E0B' : 'none'}" stroke="${isLiked ? '#F59E0B' : '#64748B'}" stroke-width="2">
              <path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1Z"/>
            </svg>
            <span class="text-sm font-medium text-slate-600">Like</span>
          </button>
        </div>

        <div class="comment-zone border-t border-slate-100 px-4 py-3 ${existingComment ? 'hidden' : ''}">
          <div class="flex items-center gap-2">
            <input type="text" class="comment-input flex-1 text-sm bg-slate-50 border border-slate-200 rounded-full px-4 py-2 outline-none focus:border-primary" placeholder="10 words only, Use creatively" />
            <button class="comment-submit shrink-0 glass-primary text-white text-xs font-semibold px-4 py-2 rounded-full transition-colors">Post</button>
          </div>
          <p class="comment-error hidden text-xs text-red-500 mt-1.5"></p>
        </div>
        <div class="comment-posted px-4 pb-3 ${existingComment ? '' : 'hidden'}">
          <p class="text-xs text-slate-400 mb-1">Your comment</p>
          <p class="text-sm bg-slate-50 rounded-xl px-3 py-2 text-ink comment-posted-text">${escapeHtml(existingComment || '')}</p>
        </div>
      `;

      el.querySelector('.like-btn').addEventListener('click', () => handleArticleLike(article.id, el));

      const input = el.querySelector('.comment-input');
      const submitBtn = el.querySelector('.comment-submit');
      const errorEl = el.querySelector('.comment-error');

      submitBtn.addEventListener('click', async () => {
        const text = input.value.trim();
        errorEl.classList.add('hidden');

        if (!text) { errorEl.textContent = 'Write something first.'; errorEl.classList.remove('hidden'); return; }
        if (countWords(text) > 10) { errorEl.textContent = 'Keep it to 10 words or fewer.'; errorEl.classList.remove('hidden'); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Posting…';

        const { error } = await supabaseClient.from('article_comments').insert({
          user_id: currentUser.id, article_id: article.id, comment_text: text,
        });

        submitBtn.disabled = false;
        submitBtn.textContent = 'Post';

        if (error) {
          errorEl.textContent = error.message.includes('duplicate') ? 'You already commented on this.' : 'Could not post comment.';
          errorEl.classList.remove('hidden');
          return;
        }

        myComments[article.id] = text;
        el.querySelector('.comment-zone').classList.add('hidden');
        const postedZone = el.querySelector('.comment-posted');
        postedZone.querySelector('.comment-posted-text').textContent = text;
        postedZone.classList.remove('hidden');
      });

      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });

      return el;
    }

    async function handleArticleLike(articleId, cardEl) {
      const btn = cardEl.querySelector('.like-btn');
      const countEl = cardEl.querySelector('.like-count');
      const isLiked = myLikes.has(articleId);
      btn.disabled = true;

      if (isLiked) {
        const { error } = await supabaseClient.from('article_likes').delete().eq('user_id', currentUser.id).eq('article_id', articleId);
        if (!error) {
          myLikes.delete(articleId);
          btn.classList.remove('liked');
          btn.querySelector('svg').setAttribute('fill', 'none');
          btn.querySelector('svg').setAttribute('stroke', '#64748B');
          countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
        }
      } else {
        const { error } = await supabaseClient.from('article_likes').insert({ user_id: currentUser.id, article_id: articleId });
        if (!error) {
          myLikes.add(articleId);
          btn.classList.add('liked');
          btn.querySelector('svg').setAttribute('fill', '#F59E0B');
          btn.querySelector('svg').setAttribute('stroke', '#F59E0B');
          countEl.textContent = parseInt(countEl.textContent) + 1;
        }
      }
      btn.disabled = false;
    }
  </script>
</body>
</html>
