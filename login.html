<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue — Picell</title>
<meta name="description" content="Enter your phone number to continue to Picell.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#2563EB', secondary: '#14B8A6', bg: '#F8FAFC', ink: '#0F172A', accent: '#F59E0B' },
        fontFamily: { display: ['Poppins', 'sans-serif'], body: ['Inter', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  body { background-color: #F8FAFC; }
  .fade-in { opacity: 0; transform: translateY(16px); animation: fadeIn 0.6s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .anchor-cta .anchor-icon { transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .anchor-cta:hover .anchor-icon { transform: translateY(3px) rotate(-8deg); }
  .anchor-cta:disabled { opacity: 0.6; cursor: not-allowed; }
  input:focus, select:focus { outline: none; }
  .field-wrap:focus-within { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .field-wrap { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .option-card { transition: all 0.15s ease; cursor: pointer; }
  .option-card.selected { border-color: #2563EB; background: #EFF6FF; }
  :focus-visible { outline: 2px solid #14B8A6; outline-offset: 2px; }

  /* iOS-style glassy buttons */
  .glass-primary {
    background: rgba(37,99,235,0.78);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 16px rgba(37,99,235,0.28), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: all 0.2s ease;
  }
  .glass-primary:hover { background: rgba(37,99,235,0.92); box-shadow: 0 6px 22px rgba(37,99,235,0.38), inset 0 1px 0 rgba(255,255,255,0.35); }
  .glass-light {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 14px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: all 0.2s ease;
  }
  .glass-light:hover { background: rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(15,23,42,0.1); }
  .glass-dark {
    background: rgba(15,23,42,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    color: white;
    transition: all 0.2s ease;
  }
  .glass-dark:hover { background: rgba(15,23,42,0.72); box-shadow: 0 6px 22px rgba(0,0,0,0.32); }

</style>
</head>
<body class="font-body text-ink antialiased min-h-screen flex items-center justify-center px-6 py-12">

  <div class="w-full max-w-md fade-in">
    <a href="index.html" class="flex items-center justify-center gap-2 font-display font-700 text-2xl mb-8">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2V8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="9.5" r="2" stroke="#2563EB" stroke-width="2"/>
        <path d="M5 13C5 13 6.5 19 12 19C17.5 19 19 13 19 13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
        <path d="M2 13H22" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Pi<span class="text-primary">cell</span></span>
    </a>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

      <!-- STEP 1: phone number -->
      <div id="stepPhone">
        <h1 class="font-display font-700 text-2xl text-ink mb-1">Continue with your number</h1>
        <p class="text-sm text-slate-500 mb-6">No password needed — just your phone number.</p>

        <div id="alertBoxPhone" class="hidden mb-4 text-sm px-4 py-3 rounded-xl"></div>

        <label class="block text-sm font-medium text-slate-700 mb-1.5">Phone Number</label>
        <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3 mb-4">
          <input type="tel" id="phoneInput" required inputmode="numeric" placeholder="01XXXXXXXXX"
            class="w-full text-sm bg-transparent placeholder:text-slate-400" />
        </div>

        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3 mb-4">
          <input type="email" id="emailInput" required placeholder="you@example.com"
            class="w-full text-sm bg-transparent placeholder:text-slate-400" />
        </div>

        <button id="phoneContinueBtn" class="anchor-cta w-full flex items-center justify-center gap-2 glass-primary text-white font-semibold text-sm py-3.5 rounded-full transition-colors">
          <svg class="anchor-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="5" r="2" stroke="white" stroke-width="2"/>
            <path d="M12 7V19" stroke="white" stroke-width="2"/>
            <path d="M6 12C6 12 7 18 12 18C17 18 18 12 18 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 12H6" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 12H21" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="phoneContinueText">Continue</span>
        </button>
      </div>

      <!-- STEP 2: new number — collect class + gender -->
      <div id="stepDetails" class="hidden">
        <h1 class="font-display font-700 text-2xl text-ink mb-1">Just a couple more details</h1>
        <p class="text-sm text-slate-500 mb-6">This number is new to us — tell us a bit about you.</p>

        <div id="alertBoxDetails" class="hidden mb-4 text-sm px-4 py-3 rounded-xl"></div>

        <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
        <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3 mb-5">
          <input type="text" id="nameInput" required placeholder="Your full name"
            class="w-full text-sm bg-transparent placeholder:text-slate-400" />
        </div>

        <label class="block text-sm font-medium text-slate-700 mb-1.5">Age</label>
        <div class="field-wrap border border-slate-200 rounded-xl px-4 py-3 mb-5">
          <input type="number" id="ageInput" required inputmode="numeric" min="5" max="99" placeholder="Your age"
            class="w-full text-sm bg-transparent placeholder:text-slate-400" />
        </div>

        <label class="block text-sm font-medium text-slate-700 mb-2">Class</label>
        <div id="classGrid" class="grid grid-cols-3 gap-2 mb-5"></div>

        <label class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
        <div id="genderGrid" class="grid grid-cols-2 gap-2 mb-6"></div>

        <button id="createAccountBtn" class="anchor-cta w-full flex items-center justify-center gap-2 glass-primary text-white font-semibold text-sm py-3.5 rounded-full transition-colors">
          <svg class="anchor-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="5" r="2" stroke="white" stroke-width="2"/>
            <path d="M12 7V19" stroke="white" stroke-width="2"/>
            <path d="M6 12C6 12 7 18 12 18C17 18 18 12 18 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 12H6" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 12H21" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span id="createAccountText">Create account</span>
        </button>

        <button id="backToPhoneBtn" class="w-full text-center text-sm text-slate-400 hover:text-slate-600 mt-3">
          ← Use a different number
        </button>
      </div>

    </div>
  </div>

  <script>
    // Picell — Supabase client config (inlined so it never depends on a separate file/folder upload)
    const SUPABASE_URL = 'https://hdfphesajupqphnbmjod.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NVkl8mcfd5Qxow-9t39sPA_OPQAcEQo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  </script>
  <script>
    const CLASSES = ['Class 6', 'Class 7', 'Class 8', 'Class 9', 'Class 10', 'HSC 1st Year', 'HSC 2nd Year', 'Admission', 'University'];
    const GENDERS = ['Male', 'Female'];

    let selectedClass = null;
    let selectedGender = null;
    let pendingDigits = null; // holds the normalized phone while on step 2
    let pendingEmail = null;  // holds the entered email while on step 2

    // Note: we intentionally do NOT auto-redirect already-logged-in users away from
    // this page. Doing so previously trapped the browser Back button in a loop
    // (dashboard -> back -> login -> auto-forward -> dashboard).

    function normalizePhone(raw) {
      return raw.replace(/\D/g, ''); // digits only
    }
    function credentialsFor(digits) {
      return {
        email: `p${digits}@braindock.app`,
        password: `BD-${digits}-lock`,
      };
    }

    function showAlert(boxId, message, type) {
      const box = document.getElementById(boxId);
      box.textContent = message;
      box.className = 'mb-4 text-sm px-4 py-3 rounded-xl ' +
        (type === 'error'
          ? 'bg-red-50 text-red-600 border border-red-100'
          : 'bg-teal-50 text-secondary border border-teal-100');
      box.classList.remove('hidden');
    }

    // ---------- STEP 1: phone continue ----------
    const phoneInput = document.getElementById('phoneInput');
    const emailInput = document.getElementById('emailInput');
    const phoneContinueBtn = document.getElementById('phoneContinueBtn');
    const phoneContinueText = document.getElementById('phoneContinueText');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    async function handlePhoneContinue() {
      document.getElementById('alertBoxPhone').classList.add('hidden');
      const digits = normalizePhone(phoneInput.value);
      const emailValue = emailInput.value.trim();

      if (digits.length < 10) {
        showAlert('alertBoxPhone', 'Please enter a valid phone number.', 'error');
        return;
      }
      if (!isValidEmail(emailValue)) {
        showAlert('alertBoxPhone', 'Please enter a valid email address.', 'error');
        return;
      }

      phoneContinueBtn.disabled = true;
      phoneContinueText.textContent = 'Checking…';

      const { email, password } = credentialsFor(digits);
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      phoneContinueBtn.disabled = false;
      phoneContinueText.textContent = 'Continue';

      if (!error && data.session) {
        // Number already registered — straight to dashboard
        window.location.href = 'dashboard.html';
        return;
      }

      const msg = error?.message?.toLowerCase() || '';
      if (msg.includes('invalid login credentials')) {
        // Number not registered yet — collect name, class, gender
        pendingDigits = digits;
        pendingEmail = emailValue;
        document.getElementById('stepPhone').classList.add('hidden');
        document.getElementById('stepDetails').classList.remove('hidden');
      } else {
        showAlert('alertBoxPhone', error?.message || 'Something went wrong. Please try again.', 'error');
      }
    }
    phoneContinueBtn.addEventListener('click', handlePhoneContinue);
    phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handlePhoneContinue(); });

    // ---------- STEP 2: class + gender selection ----------
    const classGrid = document.getElementById('classGrid');
    CLASSES.forEach(c => {
      const el = document.createElement('div');
      el.className = 'option-card border border-slate-200 rounded-xl text-center text-xs font-medium py-2.5 px-1';
      el.textContent = c;
      el.addEventListener('click', () => {
        document.querySelectorAll('#classGrid .option-card').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedClass = c;
      });
      classGrid.appendChild(el);
    });

    const genderGrid = document.getElementById('genderGrid');
    GENDERS.forEach(g => {
      const el = document.createElement('div');
      el.className = 'option-card border border-slate-200 rounded-xl text-center text-sm font-medium py-3';
      el.textContent = g;
      el.addEventListener('click', () => {
        document.querySelectorAll('#genderGrid .option-card').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedGender = g;
      });
      genderGrid.appendChild(el);
    });

    document.getElementById('backToPhoneBtn').addEventListener('click', () => {
      document.getElementById('stepDetails').classList.add('hidden');
      document.getElementById('stepPhone').classList.remove('hidden');
      pendingDigits = null;
      pendingEmail = null;
      selectedClass = null;
      selectedGender = null;
    });

    const createAccountBtn = document.getElementById('createAccountBtn');
    const createAccountText = document.getElementById('createAccountText');

    createAccountBtn.addEventListener('click', async () => {
      document.getElementById('alertBoxDetails').classList.add('hidden');

      const nameValue = document.getElementById('nameInput').value.trim();
      const ageValue = document.getElementById('ageInput').value.trim();
      if (!nameValue) { showAlert('alertBoxDetails', 'Please enter your full name.', 'error'); return; }
      if (!ageValue || Number(ageValue) < 5 || Number(ageValue) > 99) { showAlert('alertBoxDetails', 'Please enter a valid age.', 'error'); return; }
      if (!selectedClass) { showAlert('alertBoxDetails', 'Please select your class.', 'error'); return; }
      if (!selectedGender) { showAlert('alertBoxDetails', 'Please select your gender.', 'error'); return; }

      createAccountBtn.disabled = true;
      createAccountText.textContent = 'Creating account…';

      const { email, password } = credentialsFor(pendingDigits);
      const { data, error } = await supabaseClient.auth.signUp({
        email, password,
        options: { data: { phone: pendingDigits, class: selectedClass, gender: selectedGender, full_name: nameValue, contact_email: pendingEmail, age: ageValue } }
      });

      createAccountBtn.disabled = false;
      createAccountText.textContent = 'Create account';

      if (error) {
        showAlert('alertBoxDetails', error.message, 'error');
        return;
      }

      if (data.session) {
        window.location.href = 'dashboard.html';
      } else {
        // Only reachable if "Confirm email" is still enabled in Supabase settings
        showAlert('alertBoxDetails', 'Account created! Please disable "Confirm email" in Supabase → Authentication → Sign In / Providers → Email for instant access.', 'success');
      }
    });
  </script>
</body>
</html>
