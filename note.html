<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note — Picell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#2563EB', secondary: '#14B8A6', bg: '#F8FAFC', ink: '#0F172A', accent: '#F59E0B' },
        fontFamily: { display: ['Poppins', 'sans-serif'], body: ['Inter', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  body { background-color: #F8FAFC; }
  .fade-in { opacity: 0; transform: translateY(12px); animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .anchor-cta .anchor-icon { transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .anchor-cta:hover .anchor-icon { transform: translateY(3px) rotate(-8deg); }
  .like-btn.liked svg { fill: #F59E0B; stroke: #F59E0B; }
  .skeleton { background: linear-gradient(90deg,#E2E8F0 25%,#EDF2F7 37%,#E2E8F0 63%); background-size:400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  :focus-visible { outline: 2px solid #14B8A6; outline-offset: 2px; }

  /* True iOS-style frosted glass (no rainbow, no motion — subtle & clean) */
  .glass-primary {
    background: linear-gradient(180deg, rgba(59,120,246,0.85), rgba(37,99,235,0.78));
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 4px 16px rgba(37,99,235,0.25), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -1px 6px rgba(0,0,0,0.08);
    transition: all 0.25s ease;
  }
  .glass-primary:hover { box-shadow: 0 6px 20px rgba(37,99,235,0.32), inset 0 1px 1px rgba(255,255,255,0.55), inset 0 -1px 6px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .glass-primary:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(37,99,235,0.25), inset 0 1px 2px rgba(0,0,0,0.1); }

  .glass-light {
    background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.45));
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 14px rgba(15,23,42,0.08), inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1px 4px rgba(15,23,42,0.04);
    transition: all 0.25s ease;
  }
  .glass-light:hover { box-shadow: 0 6px 18px rgba(15,23,42,0.1), inset 0 1px 1px rgba(255,255,255,0.95); transform: translateY(-1px); }
  .glass-light:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(15,23,42,0.08), inset 0 1px 2px rgba(15,23,42,0.06); }

  .glass-dark {
    background: linear-gradient(180deg, rgba(30,41,59,0.75), rgba(15,23,42,0.65));
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.15), inset 0 -1px 6px rgba(0,0,0,0.15);
    color: white;
    transition: all 0.25s ease;
  }
  .glass-dark:hover { box-shadow: 0 6px 22px rgba(0,0,0,0.32), inset 0 1px 1px rgba(255,255,255,0.18); transform: translateY(-1px); }
  .glass-dark:active { transform: translateY(0); }


</style>
</head>
<body class="font-body text-ink antialiased">

  <header class="sticky top-0 z-40 bg-bg/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-2 font-display font-700 text-lg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2V8" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="9.5" r="2" stroke="#2563EB" stroke-width="2"/>
          <path d="M5 13C5 13 6.5 19 12 19C17.5 19 19 13 19 13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 13H22" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Pi<span class="text-primary">cell</span></span>
      </a>
      <a href="dashboard.html" class="text-sm text-slate-500 hover:text-primary transition-colors flex items-center gap-1.5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to Dashboard
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <div id="loadingState" class="space-y-4">
      <div class="skeleton rounded-2xl h-48"></div>
      <div class="skeleton rounded h-8 w-2/3"></div>
      <div class="skeleton rounded h-4 w-1/3"></div>
    </div>

    <div id="notFoundState" class="hidden text-center py-20">
      <p class="text-slate-400">This note could not be found.</p>
      <a href="dashboard.html" class="text-primary text-sm font-semibold hover:underline mt-2 inline-block">Return to dashboard</a>
    </div>

    <article id="noteContent" class="hidden fade-in">
      <div class="h-48 md:h-64 rounded-2xl bg-gradient-to-br from-blue-50 to-teal-50 flex items-center justify-center mb-6 overflow-hidden">
        <img id="noteThumbnail" class="hidden w-full h-full object-cover" />
        <span id="noteThumbnailFallback" class="font-display font-700 text-primary text-3xl"></span>
      </div>

      <span id="noteSubject" class="text-xs font-semibold text-secondary uppercase tracking-wide"></span>
      <h1 id="noteTitle" class="font-display font-700 text-2xl md:text-3xl text-ink mt-2 mb-2"></h1>
      <p id="noteReference" class="text-xs text-slate-400 font-medium mb-4"></p>
      <p id="noteDescription" class="text-slate-600 mb-6 leading-relaxed"></p>

      <div class="flex flex-wrap gap-2 mb-6" id="noteKeywords"></div>

      <div class="flex flex-wrap items-center gap-6 text-sm text-slate-500 border-y border-slate-200 py-4 mb-6">
        <span id="noteFileSize"></span>
        <span id="noteUploadDate"></span>
        <span id="noteDownloads"></span>
        <span id="noteLikes"></span>
      </div>

      <div class="flex items-center gap-3">
        <button id="downloadBtn" class="anchor-cta flex-1 sm:flex-none flex items-center justify-center gap-2 glass-primary text-white font-semibold text-sm px-6 py-3.5 rounded-full transition-colors">
          <svg class="anchor-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download PDF
        </button>
        <button id="mockTestBtn" class="hidden flex-1 sm:flex-none items-center justify-center gap-2 glass-light text-primary font-semibold text-sm px-6 py-3.5 rounded-full transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
          Give a Mock Test
        </button>
        <button id="likeBtn" class="like-btn w-12 h-12 rounded-full glass-light flex items-center justify-center hover:border-accent transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2">
            <path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1Z"/>
          </svg>
        </button>
      </div>
    </article>
  </main>

  <script>
    // Picell — Supabase client config (inlined so it never depends on a separate file/folder upload)
    const SUPABASE_URL = 'https://hdfphesajupqphnbmjod.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NVkl8mcfd5Qxow-9t39sPA_OPQAcEQo';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  </script>
  <script>
    let currentUser = null;
    let currentNote = null;
    let isLiked = false;

    function getNoteIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
      if (userError || !user) {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;

      const noteId = getNoteIdFromUrl();
      if (!noteId) { showNotFound(); return; }

      const { data: note, error } = await supabaseClient
        .from('notes').select('*').eq('id', noteId)
        .eq('is_published', true).eq('is_hidden', false).single();

      if (error || !note) { showNotFound(); return; }
      currentNote = note;

      const { count: mcqCount, error: mcqCountError } = await supabaseClient
        .from('mcq_questions').select('id', { count: 'exact', head: true }).eq('note_id', note.id);
      currentNote.mcqCount = mcqCountError ? 0 : (mcqCount || 0);

      const { data: likeRow } = await supabaseClient
        .from('likes').select('id').eq('user_id', currentUser.id).eq('note_id', note.id).maybeSingle();
      isLiked = !!likeRow;

      renderNote();
    })();

    function showNotFound() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('notFoundState').classList.remove('hidden');
    }

    function renderNote() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('noteContent').classList.remove('hidden');

      document.title = `${currentNote.title} — Picell`;
      document.getElementById('noteSubject').textContent = currentNote.subject;
      document.getElementById('noteTitle').textContent = currentNote.title;
      document.getElementById('noteReference').textContent = currentNote.reference_code ? `Reference: ${currentNote.reference_code}` : '';
      const mockBtn = document.getElementById('mockTestBtn');
      mockBtn.classList.toggle('hidden', !(currentNote.mcqCount > 0));
      mockBtn.classList.toggle('flex', currentNote.mcqCount > 0);
      document.getElementById('noteDescription').textContent = currentNote.description || 'No description provided.';

      if (currentNote.thumbnail_url) {
        const img = document.getElementById('noteThumbnail');
        img.src = currentNote.thumbnail_url;
        img.classList.remove('hidden');
      } else {
        document.getElementById('noteThumbnailFallback').textContent = currentNote.subject.slice(0,3).toUpperCase();
      }

      const fileSize = currentNote.file_size_kb
        ? (currentNote.file_size_kb >= 1024 ? (currentNote.file_size_kb/1024).toFixed(1) + ' MB' : currentNote.file_size_kb + ' KB')
        : '—';
      document.getElementById('noteFileSize').textContent = `📄 ${fileSize}`;
      document.getElementById('noteUploadDate').textContent = `📅 ${new Date(currentNote.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}`;
      document.getElementById('noteDownloads').textContent = `⬇ ${currentNote.downloads} downloads`;
      document.getElementById('noteLikes').textContent = `♥ ${currentNote.likes_count} likes`;

      document.getElementById('noteKeywords').innerHTML = (currentNote.keywords || []).map(k =>
        `<span class="bg-blue-50 text-primary text-xs px-3 py-1 rounded-full">${k}</span>`
      ).join('');

      updateLikeButton();
    }

    function updateLikeButton() {
      const btn = document.getElementById('likeBtn');
      const svg = btn.querySelector('svg');
      if (isLiked) {
        btn.classList.add('liked');
        svg.setAttribute('fill', '#F59E0B');
        svg.setAttribute('stroke', '#F59E0B');
      } else {
        btn.classList.remove('liked');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', '#94A3B8');
      }
    }

    document.getElementById('mockTestBtn').addEventListener('click', () => {
      if (!currentNote?.id || !currentNote.mcqCount) return;
      window.location.href = `mock-test.html?note=${encodeURIComponent(currentNote.id)}`;
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const { data: signed, error } = await supabaseClient.storage.from('pdfs').createSignedUrl(currentNote.pdf_url, 60);
      if (error || !signed) { alert('Could not generate download link. Please try again.'); return; }
      window.open(signed.signedUrl, '_blank');
      await supabaseClient.rpc('increment_downloads', { note_id_input: currentNote.id });
      currentNote.downloads += 1;
      document.getElementById('noteDownloads').textContent = `⬇ ${currentNote.downloads} downloads`;
    });

    document.getElementById('likeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('likeBtn');
      btn.disabled = true;

      if (isLiked) {
        const { error } = await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('note_id', currentNote.id);
        if (!error) { isLiked = false; currentNote.likes_count = Math.max(currentNote.likes_count - 1, 0); }
      } else {
        const { error } = await supabaseClient.from('likes').insert({ user_id: currentUser.id, note_id: currentNote.id });
        if (!error) { isLiked = true; currentNote.likes_count += 1; }
      }

      document.getElementById('noteLikes').textContent = `♥ ${currentNote.likes_count} likes`;
      updateLikeButton();
      btn.disabled = false;
    });
  </script>
</body>
</html>
