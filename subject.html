  /* Subject chip hover-preview tooltip */
  .chip-tooltip {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;
    white-space: nowrap; z-index: 30;
  }
  .chip-wrap:hover .chip-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .chip-tooltip::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--tip-color, #0F172A);
  }

    // Picell — Supabase client config (inlined so it never depends on a separate file/folder upload)
    const SUPABASE_URL = 'https://hdfphesajupqphnbmjod.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NVkl8mcfd5Qxow-9t39sPA_OPQAcEQo';

  </script>
  <script>
    const SUBJECTS = ['Bangla','English','Mathematics','Physics','Chemistry','Biology','ICT','Accounting','Finance','Marketing','Programming','Engineering','Medical','Admission'];
    const SUBJECT_FLAVOR = {
      'Bangla': 'অ আ ই ঈ...',
      'English': '"To be, or not to be"',
      'Mathematics': 'a² + b² = c²',
      'Physics': 'F = ma',
      'Chemistry': 'H₂O',
      'Biology': 'DNA → RNA → Protein',
      'ICT': '<html>',
      'Accounting': 'Debit = Credit',
      'Finance': 'ROI = (Gain − Cost) / Cost',
      'Marketing': '4Ps: Product, Price, Place, Promotion',
      'Programming': 'console.log("Hi")',
      'Engineering': 'σ = F / A',
      'Medical': '🫀 Anatomy',
      'Admission': 'MCQ + Written',
    };
    const CHIP_COLORS = ['#2563EB', '#14B8A6', '#F59E0B'];
    const PAGE_SIZE = 12;

    let currentUser = null;
    let likedNoteIds = new Set();
    let activeSubject = null;
    let activeSort = 'latest';
    let currentPage = 0;

    const params = new URLSearchParams(window.location.search);
    if (params.get('subject')) activeSubject = params.get('subject');
    if (params.get('sort')) activeSort = params.get('sort');

    // ---------- SIDEBAR DRAWER (desktop only, persists across pages via localStorage) ----------
    const SIDEBAR_KEY = 'bd_sidebar_collapsed';
    function applySidebarState() {
      const open = localStorage.getItem(SIDEBAR_KEY) === 'open';
      document.getElementById('sidebarAside').classList.toggle('sidebar-open', open);
      document.getElementById('sidebarBackdrop').classList.toggle('visible', open);
    }
    function setSidebarOpen(open) {
      localStorage.setItem(SIDEBAR_KEY, open ? 'open' : 'closed');
      applySidebarState();
    }
    applySidebarState();
    document.getElementById('sidebarOpenBtn').addEventListener('click', () => setSidebarOpen(true));
    document.getElementById('sidebarCollapseBtn').addEventListener('click', () => setSidebarOpen(false));
    document.getElementById('sidebarBackdrop').addEventListener('click', () => setSidebarOpen(false));
    document.querySelectorAll('#sidebarAside [data-sidebar-nav]').forEach(link => {
      link.addEventListener('click', () => setSidebarOpen(false));
    });

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms / 1000}s — check your internet connection or Supabase project status.`)), ms))
      ]);
    }

    function showFatalError(context, err) {
      console.error(context, err);
      let banner = document.getElementById('fatalErrorBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'fatalErrorBanner';
        banner.style.cssText = 'position:relative;z-index:9999;background:#FEF2F2;color:#B91C1C;padding:12px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;border-bottom:2px solid #FCA5A5;';
        document.body.prepend(banner);
      }
      banner.textContent = `⚠ ${context}: ${err?.message || err}`;
    }
    window.addEventListener('unhandledrejection', (e) => showFatalError('Unhandled error', e.reason));
    window.addEventListener('error', (e) => showFatalError('Script error', e.error || e.message));

    // ---------- AUTH GUARD ----------
    (async () => {
      try {
        const { data: { session }, error: sessionError } = await withTimeout(supabaseClient.auth.getSession(), 8000, 'Session check');
        if (sessionError) { showFatalError('Session check failed', sessionError); return; }
        if (!session) { window.location.href = 'login.html'; return; }

        const { data: { user }, error: userError } = await withTimeout(supabaseClient.auth.getUser(), 8000, 'Account verification');
        if (userError || !user) {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        currentUser = user;

        let { data: profile, error: profileError } = await withTimeout(
          supabaseClient.from('profiles').select('full_name, is_suspended').eq('id', currentUser.id).maybeSingle(),
          8000, 'Profile fetch'
        );
        if (profileError) { showFatalError('Could not load your profile', profileError); }

        if (!profile) {
          const meta = currentUser.user_metadata || {};
          const { data: healed, error: healError } = await supabaseClient
            .from('profiles')
            .upsert({
              id: currentUser.id,
              full_name: meta.full_name || 'Student',
              phone: meta.phone || null,
              class: meta.class || null,
              gender: meta.gender || null,
              contact_email: meta.contact_email || null,
              age: meta.age ? Number(meta.age) : null,
            })
            .select('full_name, is_suspended')
            .maybeSingle();
          if (healError) { showFatalError('Could not repair your profile', healError); }
          profile = healed;
        }

        if (profile?.is_suspended) {
          await supabaseClient.auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        const name = profile?.full_name || 'Student';
        const initial = name.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = name;
        document.getElementById('sidebarAvatar').textContent = initial;
        document.getElementById('mobileAvatarBtn').textContent = initial;
        document.getElementById('sheetAvatar').textContent = initial;
        document.getElementById('sheetName').textContent = name;

        await loadLikedNotes();
        renderSubjectChips();
        document.getElementById('sortSelect').value = activeSort;
        updatePageTitle();
        loadNotes(true);
      } catch (err) {
        showFatalError('Page failed to load', err);
      }
    })();

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('logoutBtnMobile').addEventListener('click', logout);
    function openMobileProfileSheet() { document.getElementById('mobileProfileSheet').classList.remove('hidden'); }
    document.getElementById('mobileAvatarBtn').addEventListener('click', openMobileProfileSheet);
    document.getElementById('profileMenuMobileBtn').addEventListener('click', openMobileProfileSheet);

    async function loadLikedNotes() {
      const { data } = await supabaseClient.from('likes').select('note_id').eq('user_id', currentUser.id);
      likedNoteIds = new Set((data || []).map(l => l.note_id));
    }

    function renderSubjectChips() {
      const wrap = document.getElementById('subjectChips');
      wrap.innerHTML = '';
      wrap.appendChild(makeChip('All', null));
      SUBJECTS.forEach(s => wrap.appendChild(makeChip(s, s)));
    }
    function makeChip(label, subjectValue) {
      const btn = document.createElement('button');
      btn.className = 'chip chip-wrap relative shrink-0 text-sm font-medium px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 hover:border-primary';
      btn.textContent = label;
      if (subjectValue === activeSubject) btn.classList.add('active');
      btn.addEventListener('click', () => {
        activeSubject = subjectValue;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        updatePageTitle();
        loadNotes(true);
      });

      if (subjectValue && SUBJECT_FLAVOR[subjectValue]) {
        const color = CHIP_COLORS[SUBJECTS.indexOf(subjectValue) % CHIP_COLORS.length];
        const tip = document.createElement('span');
        tip.className = 'chip-tooltip text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-lg';
        tip.style.backgroundColor = color;
        tip.style.setProperty('--tip-color', color);
        tip.textContent = SUBJECT_FLAVOR[subjectValue];
        btn.appendChild(tip);
      }
      return btn;
    }

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      activeSort = e.target.value;
      updatePageTitle();
      loadNotes(true);
    });

    function updatePageTitle() {
      const subjectPart = activeSubject ? `${activeSubject} ` : 'All ';
      const sortLabel = { latest: 'Notes', popular: 'Most Downloaded', featured: 'Most Liked' }[activeSort] || 'Notes';
      document.getElementById('pageTitle').textContent = `${subjectPart}${sortLabel}`;
    }

    function sortColumn() {
      return activeSort === 'popular' ? 'downloads' : activeSort === 'featured' ? 'likes_count' : 'created_at';
    }

    async function loadNotes(reset) {
      if (reset) { currentPage = 0; document.getElementById('notesGrid').innerHTML = Array(6).fill('<div class="skeleton rounded-2xl h-56"></div>').join(''); }

      const from = currentPage * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      let query = supabaseClient.from('notes').select('*').order(sortColumn(), { ascending: false }).range(from, to);
      if (activeSubject) query = query.eq('subject', activeSubject);

      const { data: notes, error } = await query;
      const grid = document.getElementById('notesGrid');
      const loadMoreBtn = document.getElementById('loadMoreBtn');

      if (reset) grid.innerHTML = '';

      if (error || !notes) { document.getElementById('emptyState').classList.remove('hidden'); loadMoreBtn.classList.add('hidden'); return; }

      if (notes.length === 0 && currentPage === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        loadMoreBtn.classList.add('hidden');
        return;
      }
      document.getElementById('emptyState').classList.add('hidden');

      notes.forEach(note => grid.appendChild(renderNoteCard(note)));

      if (notes.length === PAGE_SIZE) {
        loadMoreBtn.classList.remove('hidden');
      } else {
        loadMoreBtn.classList.add('hidden');
      }
    }

    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      currentPage += 1;
      loadNotes(false);
    });

    function renderNoteCard(note) {
      const el = document.createElement('div');
      el.className = 'note-card bg-white border border-slate-200 rounded-2xl overflow-hidden flex flex-col';
      const isLiked = likedNoteIds.has(note.id);
      const uploadDate = new Date(note.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const fileSize = note.file_size_kb ? (note.file_size_kb >= 1024 ? (note.file_size_kb/1024).toFixed(1) + ' MB' : note.file_size_kb + ' KB') : '—';

      el.innerHTML = `
        <div class="h-32 bg-gradient-to-br from-blue-50 to-teal-50 flex items-center justify-center cursor-pointer note-open-target">
          ${note.thumbnail_url
            ? `<img src="${note.thumbnail_url}" alt="${escapeHtml(note.title)}" class="w-full h-full object-cover" />`
            : `<span class="font-display font-700 text-primary text-xl">${escapeHtml(note.subject.slice(0,3).toUpperCase())}</span>`}
        </div>
        <div class="p-4 flex flex-col gap-2 flex-1">
          <span class="text-xs font-semibold text-secondary uppercase tracking-wide">${escapeHtml(note.subject)}</span>
          <h3 class="font-display font-600 text-ink text-sm leading-snug cursor-pointer note-open-target hover:text-primary transition-colors">${escapeHtml(note.title)}</h3>
          <p class="text-xs text-slate-500 line-clamp-2 flex-1">${escapeHtml(note.description || '')}</p>
          <div class="flex items-center justify-between text-xs text-slate-400 mt-1">
            <span>${fileSize}</span>
            <span>${uploadDate}</span>
          </div>
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span>${note.downloads} downloads</span>
            <span>${note.likes_count} likes</span>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <button class="download-btn flex-1 glass-primary text-white text-xs font-semibold py-2.5 rounded-full transition-colors">Download</button>
            <button class="like-btn ${isLiked ? 'liked' : ''} w-9 h-9 shrink-0 rounded-full glass-light flex items-center justify-center hover:border-accent transition-colors">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="${isLiked ? '#F59E0B' : 'none'}" stroke="${isLiked ? '#F59E0B' : '#94A3B8'}" stroke-width="2">
                <path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 20.3l8.8-8.6a5 5 0 0 0 0-7.1Z"/>
              </svg>
            </button>
          </div>
        </div>
      `;

      el.querySelectorAll('.note-open-target').forEach(t => t.addEventListener('click', () => { window.location.href = `note.html?id=${note.id}`; }));
      el.querySelector('.download-btn').addEventListener('click', (e) => { e.stopPropagation(); handleDownload(note); });
      el.querySelector('.like-btn').addEventListener('click', (e) => { e.stopPropagation(); handleLike(note.id, e.currentTarget); });
      return el;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function handleDownload(note) {
      const { data: signed, error } = await supabaseClient.storage.from('pdfs').createSignedUrl(note.pdf_url, 60);
      if (error || !signed) { alert('Could not generate download link. Please try again.'); return; }
      window.open(signed.signedUrl, '_blank');
      await supabaseClient.rpc('increment_downloads', { note_id_input: note.id });
    }

    async function handleLike(noteId, btnEl) {
      const isLiked = likedNoteIds.has(noteId);
      btnEl.disabled = true;
      if (isLiked) {
        const { error } = await supabaseClient.from('likes').delete().eq('user_id', currentUser.id).eq('note_id', noteId);
        if (!error) {
          likedNoteIds.delete(noteId);
          btnEl.classList.remove('liked');
          btnEl.querySelector('svg').setAttribute('fill', 'none');
          btnEl.querySelector('svg').setAttribute('stroke', '#94A3B8');
        }
      } else {
        const { error } = await supabaseClient.from('likes').insert({ user_id: currentUser.id, note_id: noteId });
        if (!error) {
          likedNoteIds.add(noteId);
          btnEl.classList.add('liked');
          btnEl.querySelector('svg').setAttribute('fill', '#F59E0B');
          btnEl.querySelector('svg').setAttribute('stroke', '#F59E0B');
        }
      }
      btnEl.disabled = false;
    }

    // ---------- SEARCH (redirects to dashboard's global search) ----------
    function handleSearchKeydown(e) {
      const value = e.target.value.trim();
      if (value === '/admin') { window.location.href = 'admin.html'; return; }
      if (e.key === 'Enter' && value) { window.location.href = `dashboard.html?q=${encodeURIComponent(value)}`; }
    }
    document.getElementById('searchInput').addEventListener('keydown', handleSearchKeydown);
    document.getElementById('searchInputMobile').addEventListener('keydown', handleSearchKeydown);
  </script>
</body>
</html>
